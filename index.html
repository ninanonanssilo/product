<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
    <div class="top-right-controls">
        <div class="theme-switch-container">
            <label id="theme-switch" class="theme-switch">
                <input type="checkbox" id="theme-toggle-checkbox">
                <span class="slider round"></span>
            </label>
        </div>
        <button id="inquiry-button">제휴 문의</button>
    </div>

    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div id="numbers-container"></div>
        <button id="generate-button">Generate Numbers</button>
    </div>

    <div class="disqus-container">
        <div id="disqus_thread"></div>
        <script>
            /**
            *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
            *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

            var disqus_config = function () {
            this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
            this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
            };
            */
            (function() { // DON'T EDIT BELOW THIS LINE
            var d = document, s = d.createElement('script');
            s.src = 'https://https-product-2m0-pages-dev-1.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
            })();
        </script>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </div>

    <div id="inquiry-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-button">&times;</button>
            <div class="contact-form-container">
                <h2>제휴 문의 (Partnership Inquiry)</h2>
                <form action="https://formspree.io/f/mzdebved" method="POST">
                    <label for="email">이메일 (Your Email):</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">문의 내용 (Your Message):</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit">문의하기 (Send Inquiry)</button>
                </form>
                <div id="form-status"></div>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
